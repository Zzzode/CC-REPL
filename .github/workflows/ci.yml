name: CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja llvm@22 lld curl openssl
          echo "$(brew --prefix llvm@22)/bin" >> $GITHUB_PATH
          # clang resolves -fuse-ld=lld as <toolchain>/bin/ld64.lld; the lld
          # formula (23) ships the binary, llvm@22 does not, so link it in.
          ln -sf "$(brew --prefix lld)/bin/ld64.lld" \
                 "$(brew --prefix llvm@22)/bin/ld64.lld"

      - name: Verify tool versions
        run: |
          cmake --version
          ninja --version
          clang++ --version
          ld64.lld --version

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@22)"
          SDKROOT="$(xcrun --show-sdk-path)"
          cmake --preset debug \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-isysroot ${SDKROOT} -isystem ${LLVM_PREFIX}/include/c++/v1 -isystem ${SDKROOT}/usr/include" \
            -DCMAKE_CXX_FLAGS_DEBUG="-g0" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -L${LLVM_PREFIX}/lib/c++ -Wl,-rpath,${LLVM_PREFIX}/lib/c++ -L${SDKROOT}/usr/lib"

      - name: Build
        timeout-minutes: 100
        # -j1: measured PSS for one heavy module compile (ui/app/app.cppm,
        # hundreds of named-module BMIs) is ~8 GB; the macos-14 runner has 14 GB
        # and two such TUs concurrently swapped for 10-18 min each. Debug info
        # disabled (-DCMAKE_CXX_FLAGS_DEBUG=-g0) to trim compiler memory.
        run: cmake --build --preset debug -j 1

      - name: Test
        timeout-minutes: 15
        run: ctest --preset debug --parallel 4
