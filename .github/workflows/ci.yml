name: CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja llvm@22 lld curl openssl
          echo "$(brew --prefix llvm@22)/bin" >> $GITHUB_PATH
          # clang resolves -fuse-ld=lld as <toolchain>/bin/ld64.lld; the lld
          # formula (23) ships the binary, llvm@22 does not, so link it in.
          ln -sf "$(brew --prefix lld)/bin/ld64.lld" \
                 "$(brew --prefix llvm@22)/bin/ld64.lld"

      - name: Verify tool versions
        run: |
          cmake --version
          ninja --version
          clang++ --version
          ld64.lld --version

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@22)"
          SDKROOT="$(xcrun --show-sdk-path)"
          cmake --preset debug \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-isysroot ${SDKROOT} -isystem ${LLVM_PREFIX}/include/c++/v1 -isystem ${SDKROOT}/usr/include" \
            -DCMAKE_CXX_FLAGS_DEBUG="-g0" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -L${LLVM_PREFIX}/lib/c++ -Wl,-rpath,${LLVM_PREFIX}/lib/c++ -L${SDKROOT}/usr/lib"

      - name: Build
        timeout-minutes: 60
        # Ninja default parallelism (= host CPU count via the compile_jobs
        # pool in CMakeLists.txt). -g0 trims per-clang memory so the 14GB
        # runner tolerates several heavy module compiles at once.
        run: cmake --build --preset debug

      - name: Test
        timeout-minutes: 20
        # ctest default is serial (CLAUDE.md: timing-sensitive backoff/server
        # tests flake under parallel scheduling). truecolor so RGB palette
        # goldens render the 24-bit escapes they were captured with instead of
        # 16-color ANSI.
        env:
          COLORTERM: truecolor
          TERM: xterm-256color
        run: ctest --preset debug
