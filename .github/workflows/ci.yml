name: CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja llvm lld curl openssl
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Verify tool versions
        run: |
          cmake --version
          ninja --version
          clang++ --version
          ld64.lld --version

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          SDKROOT="$(xcrun --show-sdk-path)"
          cmake --preset debug \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-isysroot ${SDKROOT} -isystem ${LLVM_PREFIX}/include/c++/v1 -isystem ${SDKROOT}/usr/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -L${LLVM_PREFIX}/lib/c++ -Wl,-rpath,${LLVM_PREFIX}/lib/c++ -L${SDKROOT}/usr/lib"

      - name: Build
        timeout-minutes: 70
        # -j2: named-module compiles of the large aggregating TUs (test_core,
        # app_constructor, dialog impls) each need multiple GB; ninja's default
        # (~5 concurrent on the 3-vCPU/14GB runner) swaps the machine and the
        # build freezes silently at the final ~90 units.
        run: cmake --build --preset debug -j 2

      - name: Test
        timeout-minutes: 15
        run: ctest --preset debug --parallel 4
