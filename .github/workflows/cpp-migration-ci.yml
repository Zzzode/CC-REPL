name: C++ Migration CI

on:
  push:
    branches: [master]
    paths:
      - "cpp_migration/**"
  pull_request:
    branches: [master]
    paths:
      - "cpp_migration/**"

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja llvm curl openssl
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Verify tool versions
        run: |
          cmake --version
          ninja --version
          clang++ --version

      - name: Configure
        working-directory: cpp_migration
        run: cmake --preset debug

      - name: Build
        timeout-minutes: 15
        working-directory: cpp_migration
        run: cmake --build --preset debug

      - name: Test
        timeout-minutes: 5
        working-directory: cpp_migration
        run: ctest --preset debug --parallel 4
