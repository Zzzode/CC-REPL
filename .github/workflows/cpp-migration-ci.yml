name: C++ Migration CI

on:
  push:
    branches: [master]
    paths:
      - "cpp_migration/**"
      - ".github/workflows/cpp-migration-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "cpp_migration/**"
      - ".github/workflows/cpp-migration-ci.yml"

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja llvm curl openssl
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Verify tool versions
        run: |
          cmake --version
          ninja --version
          clang++ --version

      - name: Configure
        working-directory: cpp_migration
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          SDKROOT="$(xcrun --show-sdk-path)"
          cmake --preset debug \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-isysroot ${SDKROOT} -isystem ${LLVM_PREFIX}/include/c++/v1 -isystem ${SDKROOT}/usr/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L${LLVM_PREFIX}/lib/c++ -Wl,-rpath,${LLVM_PREFIX}/lib/c++ -L${SDKROOT}/usr/lib"

      - name: Build
        timeout-minutes: 15
        working-directory: cpp_migration
        run: cmake --build --preset debug

      - name: Test
        timeout-minutes: 5
        working-directory: cpp_migration
        run: ctest --preset debug --parallel 4
